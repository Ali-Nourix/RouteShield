<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RouteShield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg width="15" height="18" viewBox="0 0 24 28" aria-hidden="true">
        <path d="M12 1 23 5.2v9.6c0 6.4-5.2 10.6-11 12.2C6.2 25.4 1 21.2 1 14.8V5.2Z" fill="#201e1d"/>
        <path d="M6.5 19.2 10.6 14l3 2.6 5.2-7M14 9.4h5.4v5.4" fill="none" stroke="#ec3013" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="wordmark">ROUTESHIELD</span>
    </div>
    <div id="status" class="chip chip-idle">
      <span class="mark"></span>
      <span id="status-text">Looking for RouteShield</span>
    </div>
  </header>

  <section class="subject">
    <div class="kicker" id="subject-kicker">THIS TAB</div>
    <div class="subject-name" id="subject-name">&nbsp;</div>
  </section>

  <section id="choices" class="choices" role="radiogroup" aria-label="Route for this tab"></section>

  <p id="note" class="note"></p>

  <footer class="foot">
    <span id="foot-left">RouteShield</span>
    <button id="refresh" class="ghost" type="button">Refresh</button>
  </footer>

  <script src="bridge.js"></script>
  <script src="popup.js"></script>
</body>
</html>
