name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  SING_BOX_VERSION: 1.14.0

jobs:
  core:
    name: Core and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The configuration tests run every generated policy through the real core,
      # which is what catches a sing-box release changing the rules underneath us.
      - name: Fetch the sing-box core
        run: |
          set -euo pipefail
          archive="sing-box-${SING_BOX_VERSION}-linux-amd64"
          curl --fail --silent --show-error --location \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${archive}.tar.gz" \
            --output sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          echo "ROUTESHIELD_SINGBOX=${PWD}/${archive}/sing-box" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test tests/RouteShield.Core.Tests/RouteShield.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

  addons:
    name: Browser add-ons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Stage the Firefox add-on exactly as the build script does (shared files beside the
      # browser's own), then run Mozilla's linter over it: the same check AMO applies on upload.
      - name: Stage the Firefox add-on
        run: |
          set -euo pipefail
          mkdir -p staged/firefox
          cp -r extension/shared staged/firefox/shared
          cp extension/firefox/* staged/firefox/
          node --check staged/firefox/background.js
          node --check staged/firefox/shared/bridge.js
          node --check staged/firefox/shared/popup.js

      - name: Lint with web-ext
        run: npx --yes web-ext@8 lint --source-dir staged/firefox --self-hosted --no-config-discovery

      - name: Check the Chrome scripts
        run: |
          set -euo pipefail
          node --check extension/chrome/background.js
          node -e "JSON.parse(require('fs').readFileSync('extension/chrome/manifest.json','utf8')); console.log('chrome manifest ok')"

  app:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/RouteShield/RouteShield.csproj -c Release
