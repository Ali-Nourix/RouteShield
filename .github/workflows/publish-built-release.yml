name: Publish built Windows Android and extensions

on:
  push:
    branches: [main]
    paths: ['ci/release-request.json']
  workflow_run:
    workflows: ['Build Windows and Android']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful owner-signed Build Windows and Android run ID'
        type: string
        required: true
      tag:
        description: 'Optional v-prefixed release tag; blank creates a unique build snapshot tag'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: routeshield-release-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    environment: android-release
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Test publication and archive safety
        run: python3 -m unittest discover -s ci/tests -v
      - name: Install APK signature verifier
        run: bash ci/scripts/setup-android-sdk.sh
      - name: Download trusted outputs and prepare separate release assets
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: python3 ci/scripts/publish-built-release.py prepare
      - name: Upload and publish a verified pre-release
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/scripts/publish-built-release.py publish
