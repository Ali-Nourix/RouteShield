name: Release

# Pushing a v* tag publishes the build as the release for that tag. Running the
# workflow by hand with a version does the same and creates the tag on the way.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (for example 1.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw="${{ inputs.version }}"
          else
            raw="$GITHUB_REF_NAME"
          fi

          # A leading v is how the tag is written, so accept it either way.
          version="${raw#v}"

          # Two to four parts, matching what .NET accepts for an assembly version.
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::'$raw' is not a version number like 1.2.3."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build the package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1 -Runtime win-x64 -Version ${{ steps.version.outputs.version }}

      # Run after the build, against the core the build just downloaded, so the release is
      # gated on the exact sing-box being shipped accepting every configuration we generate.
      - name: Verify the configurations against the packaged core
        env:
          ROUTESHIELD_SINGBOX: ${{ github.workspace }}\third_party\sing-box\sing-box.exe
        run: dotnet test tests/RouteShield.Core.Tests/RouteShield.Core.Tests.csproj -c Release

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouteShield-${{ steps.version.outputs.version }}-win-x64
          path: artifacts/*
          if-no-files-found: error

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          tag='${{ steps.version.outputs.tag }}'

          notes=$(cat <<NOTES
          RouteShield $version for Windows 10 and 11 (x64).

          The package carries the official sing-box core, verified against the digest GitHub
          publishes for the release asset. Unzip anywhere and run RouteShield.exe as
          administrator — the TUN adapter and the kill-switch firewall rules both need it.

          \`RouteShield-$version-win-x64.zip.sha256\` holds the checksum of the package.
          NOTES
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* \
              --title "RouteShield $version" \
              --notes "$notes" \
              --target "$GITHUB_SHA"
          fi
